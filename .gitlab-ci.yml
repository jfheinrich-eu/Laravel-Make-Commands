# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
  - build
  # testbench
  - testbench
  # PHPstan
  - code-quality
  # SAST scanner
  - test
  - convert
  - release-fetch-version
  - release-build
  - release
  #- triggers
  - badges
  - deploy

cache:
  key:
    files:
      - composer.lock
  paths:
    - vendor/
    - composer.lock
variables:
  DOCKER_IMAGE: "registry.gitlab.com/jfheinrich-eu/docker/nodejs:latest"
  DOCKER_PY_IMAGE: "python:latest"
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, vendor, node_modules"

default:
  tags:
    - docker

include:
  - template: Jobs/SAST.gitlab-ci.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_NAME == "dependabot"'
        when: never
      - when: always
  - local: gitlab-ci/build.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_NAME == "dependabot"'
        when: never
      - when: always
  - local: gitlab-ci/tests.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_NAME == "dependabot"'
        when: never
      - when: always
  - local: gitlab-ci/semver.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_NAME == "dependabot"'
        when: never
      - when: always
  - local: gitlab-ci/sast-report.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_NAME == "dependabot"'
        when: never
      - when: always
  #- local: gitlab-ci/triggers.yml
  - local: gitlab-ci/badges.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_NAME == "dependabot"'
        when: never
      - when: always
  - local: gitlab-ci/deploy-gitlab.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_NAME == "dependabot"'
        when: never
      - when: always
  - template: Security/Secret-Detection.gitlab-ci.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_NAME == "dependabot"'
        when: never
      - when: always
  - component: $CI_SERVER_FQDN/dependabot-gitlab/dependabot-standalone/template@3.18.1
    inputs:
      github_access_token: $SETTINGS_GITHUB_ACCESS_TOKEN
      gitlab_access_token: $SETTINGS_GITLAB_ACCESS_TOKEN
    rules:
      - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_NAME == "dependabot"'
        when: always
